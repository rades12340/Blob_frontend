# Local stack: blob_frontend on http://localhost:5173.
# Needs the other stacks running first. The browser calls /api/* here and this
# server forwards it to the gateway over the shared "blob-storage" network.
name: blob-frontend

services:
  frontend:
    build:
      context: .
      args:
        GATEWAY_URL: http://gateway:8080
    ports:
      - "5173:5173"
    networks:
      - blob-storage

networks:
  blob-storage:
    external: true
